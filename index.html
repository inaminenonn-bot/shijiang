<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谢雨捷 | 华中师范大学 国家公费师范生 数学试讲合集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", SimHei, sans-serif;
        }
        body {
            background-color: #f0f4f9;
            color: #222;
            line-height: 1.7;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        /* 顶部深蓝色头部 */
        header {
            text-align: center;
            padding: 50px 20px;
            background: #0f3460;
            color: #ffffff;
            border-radius: 16px;
            margin-bottom: 40px;
            box-shadow: 0 4px 16px rgba(15, 52, 96, 0.25);
        }
        header h1 {
            font-size: 32px;
            margin-bottom: 14px;
        }
        header p {
            font-size: 18px;
            opacity: 0.9;
        }
        /* 无标题纯文字说明卡片 */
        .desc-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 2px 14px rgba(15, 52, 96, 0.12);
            margin-bottom: 40px;
        }
        .desc-card p {
            font-size: 16px;
            color: #333;
            text-align: justify;
        }
        /* 视频区域通用样式 */
        .video-section h2 {
            color: #0f3460;
            margin-bottom: 26px;
            font-size: 24px;
            border-left: 6px solid #0f3460;
            padding-left: 14px;
        }
        .video-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
            gap: 30px;
        }
        .video-item {
            background: #fff;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 2px 14px rgba(15, 52, 96, 0.12);
        }
        .video-item h3 {
            color: #0f3460;
            margin-bottom: 16px;
            font-size: 19px;
        }
        .iframe-wrap {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* 底部页脚 */
        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 20px;
            color: #555;
            font-size: 15px;
            border-top: 1px solid #d6e0ed;
        }
        /* 移动端适配 */
        @media (max-width: 580px) {
            .video-list {
                grid-template-columns: 1fr;
            }
            .iframe-wrap {
                height: 220px;
            }
            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>谢雨捷 高中数学试讲视频</h1>
            <p>华中师范大学 · 国家公费师范生</p>
        </header>

        <!-- 无标题纯文字说明卡片 -->
        <div class="desc-card">
            <p>本页面收录9节高中数学课堂试讲实录，涵盖函数、圆锥曲线、三角函数、平面向量、解三角形、排列组合等核心教学课题，完整展示教学设计、课堂导入、新知讲授、例题讲解、课堂小结全流程教学基本功。</p>
        </div>

        <section class="video-section">
            <h2>试讲视频</h2>
            <div class="video-list">
                <!-- 1.平面向量基本定理 -->
                <div class="video-item">
                    <h3>1. 平面向量基本定理</h3>
                    <div class="iframe-wrap">
                        <iframe src="https://player.bilibili.com/player.html?bvid=BV1MT3G6jEfp&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 2.椭圆及其标准方程 -->
                <div class="video-item">
                    <h3>2. 椭圆及其标准方程</h3>
                    <div class="iframe-wrap">
                        <iframe src="https://player.bilibili.com/player.html?bvid=BV1bT3G6jEVM&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 3.任意角 -->
                <div class="video-item">
                    <h3>3. 任意角</h3>
                    <div class="iframe-wrap">
                        <iframe src="https://player.bilibili.com/player.html?bvid=BV1Vz3G6sETa&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 4.三角函数的概念 -->
                <div class="video-item">
                    <h3>4. 三角函数的概念</h3>
                    <div class="iframe-wrap">
                        <iframe src="https://player.bilibili.com/player.html?bvid=BV1X63G69EvU&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 5.诱导公式 -->
                <div class="video-item">
                    <h3>5. 诱导公式</h3>
                    <div class="iframe-wrap">
                        <iframe src="https://player.bilibili.com/player.html?bvid=BV1ST3G6jEPc&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 6.函数的概念 -->
                <div class="video-item">
                    <h3>6. 函数的概念</h3>
                    <div class="iframe-wrap">
                        <iframe src="https://player.bilibili.com/player.html?bvid=BV18N3G6mEuS&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 7.二次函数与一元二次方程、不等式 -->
                <div class="video-item">
                    <h3>7. 二次函数与一元二次方程、不等式</h3>
                    <div class="iframe-wrap">
                        <iframe src="https://player.bilibili.com/player.html?bvid=BV1MT3G6jEC5&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 8.排列数 -->
                <div class="video-item">
                    <h3>8. 排列数</h3>
                    <div class="iframe-wrap">
                        <iframe src="https://player.bilibili.com/player.html?bvid=BV1MM3G61Euw&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 9.余弦定理 -->
                <div class="video-item">
                    <h3>9. 余弦定理</h3>
                    <div class="iframe-wrap">
                        <iframe src="https://player.bilibili.com/player.html?bvid=BV1uN3G6mEz7&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            © 2026 谢雨捷 | 华中师范大学 国家公费师范生 数学试讲作品集
        </footer>
    </div>
</body>
</html>
